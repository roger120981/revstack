# fly.toml app configuration file generated for revstack
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "revstack"
primary_region = "dfw"
kill_signal = "SIGTERM"
kill_timeout = "5s"
swap_size_mb = 512

[build]

[deploy]
  release_command = "/app/bin/migrate"

[env]
  PHX_HOST = "revstack.fly.dev"
  PORT = "8080"
  ECTO_IPV6 = "true"
  ERL_AFLAGS = "-proto_dist inet6_tcp"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 1000
