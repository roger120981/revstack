---
- name: Create app directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"
  loop:
    - "{{ app_dir }}"
    - "{{ app_dir }}/releases"

- name: Sync project files to server
  synchronize:
    src: "{{ playbook_dir }}/../"
    dest: "{{ app_dir }}/source/"
    delete: true
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=_build"
      - "--exclude=deps"
      - "--exclude=node_modules"
      - "--exclude=deploy"
      - "--exclude=tmp"
      - "--exclude=.elixir_ls"
      - "--exclude=erl_crash.dump"

- name: Set source directory ownership
  file:
    path: "{{ app_dir }}/source"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    recurse: true

- name: Deploy environment file
  template:
    src: env.production.j2
    dest: "{{ app_dir }}/.env.production"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0600"

- name: Deploy docker-compose file
  template:
    src: docker-compose.yml.j2
    dest: "{{ app_dir }}/docker-compose.yml"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"

- name: Build Docker image
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    build: always
    services:
      - app
    state: present

- name: Run database migrations
  command: >
    docker compose -f {{ app_dir }}/docker-compose.yml
    run --rm app /app/bin/migrate
  become_user: "{{ app_user }}"
  register: migration_result
  changed_when: "'Migrating' in migration_result.stdout"

- name: Start application
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    state: present
    pull: never
  register: compose_result

- name: Restart app container if image was rebuilt
  command: docker compose -f {{ app_dir }}/docker-compose.yml up -d --force-recreate app
  become_user: "{{ app_user }}"
  when: compose_result.changed | default(false)

- name: Wait for app to be healthy
  uri:
    url: "http://127.0.0.1:{{ app_port }}"
    method: GET
    status_code: 200
  register: health_check
  retries: 30
  delay: 2
  until: health_check.status == 200

- name: Prune old Docker images
  command: docker image prune -af --filter "until=168h"
  changed_when: false
